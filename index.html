
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101531">
<title>Dompet Digital Cerdas</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<header>
    <h1>Dompet Digital Cerdas</h1>
    <button class="sm" id="theme" type="button">Ganti tema</button>
</header>

<p id="stor" class="mu" role="status" hidden>
Penyimpanan browser tidak aktif.
</p>

<div class="grid">

<section class="hero full">
    <div class="lbl">Saldo total</div>
    <div class="big" id="saldo">Rp 0</div>

    <div class="row">
        <div class="chip">
            <span class="lbl">Masuk bulan ini</span>
            <b id="inM"></b>
        </div>
        <div class="chip">
            <span class="lbl">Keluar bulan ini</span>
            <b id="outM"></b>
        </div>
        <div class="chip">
            <span class="lbl">Rasio tabung</span>
            <b id="rate"></b>
        </div>
    </div>

    <div class="row" id="wals"></div>

    <div class="track">
        <div class="fill" id="fill"></div>
        <div class="tick" id="tick"></div>
        <div class="tickl" id="tickl">hari ini</div>
    </div>

    <p class="insight" id="insight"></p>

    <div class="bud">
        <label for="budget">Anggaran bulanan Rp</label>
        <input id="budget" inputmode="numeric">
    </div>
</section>

<section>
    <h2>Catat transaksi</h2>

    <div class="seg">
        <button type="button" id="tOut" aria-pressed="true">
            Pengeluaran
        </button>
        <button type="button" id="tIn" aria-pressed="false">
            Pemasukan
        </button>
    </div>

    <label for="amount">Jumlah (Rp)</label>
    <input id="amount" inputmode="numeric"
    placeholder="mis. 25.000">

    <div class="row">
        <div class="field">
            <label for="cat">Kategori</label>
            <select id="cat"></select>
        </div>
        <div class="field">
            <label for="date">Tanggal</label>
            <input id="date" type="date">
        </div>
    </div>

    <label for="wal">Dompet</label>
    <select id="wal">
        <option value="Tunai">💵 Tunai</option>
        <option value="Bank">🏦 Bank</option>
        <option value="E-wallet">📱 E-wallet</option>
    </select>

    <label for="note">Catatan</label>
    <input id="note" placeholder="Opsional">

    <button id="add" type="button">Simpan transaksi</button>
</section>

<section>
    <h2>Riwayat transaksi</h2>
    <div class="row">
        <select id="filter">
            <option value="all">Semua transaksi</option>
            <option value="in">Pemasukan</option>
            <option value="out">Pengeluaran</option>
        </select>
    </div>
    <div id="history"></div>
</section>

<section>
    <h2>Target tabungan</h2>
    <label for="goalName">Nama target</label>
    <input id="goalName" placeholder="Dana darurat">

    <label for="goalTarget">Target (Rp)</label>
    <input id="goalTarget" inputmode="numeric">

    <label for="goalSaved">Tabungan terkumpul (Rp)</label>
    <input id="goalSaved" inputmode="numeric">

    <button id="saveGoal" type="button">Simpan target</button>
    <div id="goalProgress"></div>
</section>

<section>
    <h2>Ekspor data</h2>
    <button id="export" type="button">Unduh CSV</button>
</section>

</div>
</main>

<script src="script.js"></script>
</body>
      </html>
